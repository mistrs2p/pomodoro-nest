services:
  postgres:
    image: postgres:18
    container_name: postgres

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql

    networks:
      - nest-net

volumes:
  pgdata:

networks:
  nest-net: